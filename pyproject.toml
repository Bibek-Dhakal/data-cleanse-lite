[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datacleanse-lite"
version = "0.1.1"
description = "Automated Multi-Source E-Commerce ETL Pipeline"
authors = [{ name = "Bibek Dhakal" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.6",
    "pre-commit>=3.5.0",
    "jupyter>=1.0.0"
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "--cov=datacleanse --cov-report=term-missing"
testpaths = ["tests"]
